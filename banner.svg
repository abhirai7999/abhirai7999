<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="230" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#bg)"/>

    <!-- scanlines drifting downward -->
    <g opacity="0.10">
      <rect x="0" y="0" width="1000" height="2" fill="#39FF14"/>
      <rect x="0" y="40" width="1000" height="2" fill="#39FF14"/>
      <rect x="0" y="80" width="1000" height="2" fill="#39FF14"/>
      <rect x="0" y="120" width="1000" height="2" fill="#39FF14"/>
      <rect x="0" y="160" width="1000" height="2" fill="#39FF14"/>
      <rect x="0" y="200" width="1000" height="2" fill="#39FF14"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 40" dur="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- title: RGB-split glitch effect -->
    <g font-family="'Courier New', Consolas, monospace" font-weight="bold" text-anchor="middle">
      <text x="502" y="103" font-size="46" letter-spacing="4" fill="#ff2b4d" opacity="0.75">
        ENTER THE APEX REALM
        <animate attributeName="x" values="502;496;504;500;502" keyTimes="0;0.2;0.45;0.7;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="498" y="97" font-size="46" letter-spacing="4" fill="#00e5ff" opacity="0.75">
        ENTER THE APEX REALM
        <animate attributeName="x" values="498;504;496;500;498" keyTimes="0;0.2;0.45;0.7;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="100" font-size="46" letter-spacing="4" fill="#39FF14">
        ENTER THE APEX REALM
        <animate attributeName="opacity" values="1;1;0.85;1;1;0.9;1" keyTimes="0;0.3;0.35;0.4;0.75;0.8;1" dur="3.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- subtitle -->
    <text x="500" y="145" font-family="'Courier New', Consolas, monospace" font-size="18" letter-spacing="3" fill="#8be9c8" text-anchor="middle">
      SALESFORCE DEVELOPER // APEX + LWC + AUTOMATION
    </text>

    <!-- blinking terminal cursor -->
    <rect x="836" y="131" width="11" height="18" fill="#39FF14">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- status line -->
    <text x="500" y="190" font-family="'Courier New', Consolas, monospace" font-size="13" letter-spacing="2" fill="#4b5568" text-anchor="middle">
      [ SYSTEM ONLINE ] [ STATUS: DEPLOYING ] [ UPTIME: 24/7 ]
    </text>
  </g>
</svg>
