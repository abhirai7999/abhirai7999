<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="frame2">
      <rect x="0" y="0" width="1000" height="150" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame2)">
    <rect width="1000" height="150" fill="url(#bg2)"/>

    <g opacity="0.10">
      <rect x="0" y="0" width="1000" height="2" fill="#39FF14"/>
      <rect x="0" y="30" width="1000" height="2" fill="#39FF14"/>
      <rect x="0" y="60" width="1000" height="2" fill="#39FF14"/>
      <rect x="0" y="90" width="1000" height="2" fill="#39FF14"/>
      <rect x="0" y="120" width="1000" height="2" fill="#39FF14"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 30" dur="1.4s" repeatCount="indefinite"/>
    </g>

    <g font-family="'Courier New', Consolas, monospace" font-weight="bold" text-anchor="middle">
      <text x="502" y="83" font-size="34" letter-spacing="3" fill="#ff2b4d" opacity="0.75">
        THANKS FOR VISITING!
        <animate attributeName="x" values="502;497;504;500;502" keyTimes="0;0.2;0.45;0.7;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="498" y="77" font-size="34" letter-spacing="3" fill="#00e5ff" opacity="0.75">
        THANKS FOR VISITING!
        <animate attributeName="x" values="498;503;496;500;498" keyTimes="0;0.2;0.45;0.7;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="80" font-size="34" letter-spacing="3" fill="#39FF14">
        THANKS FOR VISITING!
        <animate attributeName="opacity" values="1;1;0.85;1;1;0.9;1" keyTimes="0;0.3;0.35;0.4;0.75;0.8;1" dur="3.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="500" y="115" font-family="'Courier New', Consolas, monospace" font-size="15" letter-spacing="2" fill="#8be9c8" text-anchor="middle">
      ⭐ show some love by starring my repos ⭐
    </text>
  </g>
</svg>
